name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:          # the Release workflow runs these tests before building
  workflow_dispatch:      # run by hand from the Actions tab (or gh workflow run Tests)

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: API tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -m "not ui and not toolchains"

  toolchains:
    name: Real runs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # GitHub's machines come with these, so here a missing one fails rather than skips
      EUT_REQUIRE_TOOLS: all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Run a small program in each language with the command the workspace suggests
        run: pytest -m toolchains -rs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: JavaScript syntax
        run: for f in static/*.js tools/*.js; do node --check "$f"; done
      - name: Colour contrast for every theme
        run: node tools/check_contrast.js

  ui:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements.txt pytest httpx playwright
          python -m playwright install --with-deps chromium
      - name: Test every screen in a real browser
        run: pytest -m ui

  mobile:
    name: Phone app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          npm ci
          pip install -r ../requirements.txt
          npx playwright install --with-deps chromium
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Build the app's web files
        run: npm run build
      - name: Phone API, parity with the desktop server, and the app at phone size in a browser
        env:
          EUT_PYTHON: python      # the desktop server the parity tests compare against
          EUT_UI: "1"
        run: npx vitest run

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install
        run: npm ci
      - name: Build the web files and copy them into the Android project
        run: npm run build && npx cap sync android
      - name: Build the app (debug, and the release build unsigned)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - name: Check the app package
        run: node scripts/check-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: EasyUniTrack-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  package:
    name: Windows build, start-up and install test
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Build the app folder
        run: pyinstaller --noconfirm EasyUniTrack.spec
      - name: Check the build contains the app files
        shell: pwsh
        run: |
          foreach ($f in "dist/EasyUniTrack/EasyUniTrack.exe", "dist/EasyUniTrack/_internal/static/index.html", "dist/EasyUniTrack/_internal/VERSION") {
            if (-not (Test-Path $f)) { throw "Missing from build: $f" }
          }
      - name: Launch the packaged app and check it gets past the intro
        run: python tools/smoke_desktop.py --max-seconds 45 dist/EasyUniTrack/EasyUniTrack.exe
      - name: Start-up test as downloaded (every file marked, as when the portable zip is unzipped)
        run: |
          python tools/mark_downloaded.py dist/EasyUniTrack dist-downloaded/EasyUniTrack
          python tools/smoke_desktop.py --max-seconds 45 dist-downloaded/EasyUniTrack/EasyUniTrack.exe
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          iscc /DAppVersion=$((Get-Content VERSION -Raw).Trim()) installer\easyunitrack.iss
      - name: Install, update from the last release, uninstall
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          python tools/install_test.py "dist/EasyUniTrack-Setup-$v.exe" --version $v
