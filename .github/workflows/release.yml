name: Release

# Publish a version:  python tools/bump_version.py minor   (then fill in CHANGELOG.md)
#                     git commit -am "Release v3.3.0" && git tag v3.3.0 && git push origin main --tags
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  windows:
    name: Build Windows installer
    needs: tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"       # UTF-8 everywhere, so changelog characters like "→" can't break the build
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the VERSION file
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tag) { throw "Tag v$tag doesn't match VERSION ($version). Run tools/bump_version.py first." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install build tools
        run: |
          pip install -r requirements-dev.txt
          choco install innosetup -y --no-progress

      - name: Release notes from CHANGELOG.md
        run: python tools/release_notes.py ${{ steps.version.outputs.version }} release-notes.md

      - name: Build the app
        run: pyinstaller --noconfirm Trackademic.spec

      - name: Start-up test - launch the built app and check it gets past the intro
        run: python tools/smoke_desktop.py --max-seconds 45 dist/Trackademic/Trackademic.exe

      - name: Build the installer
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} installer\trackademic.iss

      - name: Install test - update from the last release, open, uninstall
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/install_test.py "dist/Trackademic-Setup-${{ steps.version.outputs.version }}.exe" --version ${{ steps.version.outputs.version }}

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist/Trackademic/* -DestinationPath "dist/Trackademic-$v-windows-portable.zip"
          $files = "Trackademic-Setup-$v.exe", "Trackademic-$v-windows-portable.zip"
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower(), $f }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $extra = @()
          if ($v -match "-") { $extra += "--prerelease" }     # e.g. 3.3.0-beta.1
          gh release create "${{ github.ref_name }}" `
            "dist/Trackademic-Setup-$v.exe" "dist/Trackademic-$v-windows-portable.zip" "dist/SHA256SUMS.txt" `
            --title "Trackademic $v" --notes-file release-notes.md @extra
