<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trackademic</title>
<meta name="theme-color" content="#D2461A">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icon-32.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<!-- Applies the saved colours, fonts and light/dark before first paint (no flash) -->
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Main">
    <a class="brand" href="#/today" aria-label="Trackademic home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Track<b>ademic</b></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="navFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-titles">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <div class="topbar-actions" id="headerActions"></div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <header class="drawer-head">
    <h2 id="drawerTitle"></h2>
    <button class="icon-btn" data-action="close-drawer" aria-label="Close"></button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer class="drawer-foot" id="drawerFoot"></footer>
</section>

<div class="dialog-wrap" id="confirm" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="confirmNo">Cancel</button>
      <button class="btn btn-danger" id="confirmYes">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/icons.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
