<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifePlanner</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN SYSTEM — LifePlanner v2
   ═══════════════════════════════════════════════════════ */
:root {
  --bg: #0f1117;
  --bg-card: #1a1d27;
  --bg-card-hover: #1f2230;
  --bg-input: #13151d;
  --border: #2a2d3a;
  --border-focus: #6366f1;
  --text: #e4e6f0;
  --text-muted: #7c8097;
  --text-dim: #555974;
  --primary: #6366f1;
  --primary-hover: #5558e6;
  --primary-glow: rgba(99,102,241,0.15);
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --success: #10b981;
  --warning: #f59e0b;
  --info: #06b6d4;
  --sidebar-bg: #14161f;
  --sidebar-width: 240px;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}

[data-theme="light"] {
  --bg: #f5f5f9;
  --bg-card: #ffffff;
  --bg-card-hover: #fafafe;
  --bg-input: #f0f0f5;
  --border: #e2e4ea;
  --text: #1a1c2e;
  --text-muted: #6b7084;
  --text-dim: #9ca0b4;
  --sidebar-bg: #fafafe;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.08);
  --primary-glow: rgba(99,102,241,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  transition: background var(--transition), color var(--transition);
}

/* ═══════ SIDEBAR ═══════ */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  gap: 6px;
  flex-shrink: 0;
  transition: background var(--transition), width var(--transition);
  z-index: 50;
}
.logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  padding: 0 12px 16px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo span { font-size: 24px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
  transition: all var(--transition);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--bg-card); color: var(--text); }
.nav-item.active { background: var(--primary); color: white; }
.nav-item .icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.nav-section { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); padding: 20px 12px 8px; font-weight: 600; }
.theme-toggle {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  border: none;
  background: none;
  width: 100%;
  transition: all var(--transition);
}
.theme-toggle:hover { background: var(--bg-card); color: var(--text); }

/* ═══════ MAIN CONTENT ═══════ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.header {
  padding: 16px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.header-actions { display: flex; gap: 10px; }
.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 32px;
}
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ═══════ TAB NAVIGATION ═══════ */
.tab-nav {
  display: flex;
  gap: 4px;
  padding: 0 32px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}
.tab-link {
  padding: 12px 20px;
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab-link:hover { color: var(--text); }
.tab-link.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ═══════ BUTTONS ═══════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px var(--primary-glow); }
.btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: var(--danger-hover); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { filter: brightness(1.1); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: var(--radius-xs); }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 4px; }

/* ═══════ STATS GRID ═══════ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: all var(--transition);
}
.stat-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
.stat-card .stat-icon { font-size: 24px; margin-bottom: 6px; }
.stat-card .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

/* ═══════ TASK LIST ═══════ */
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.search-input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  outline: none;
  transition: border var(--transition);
  min-width: 200px;
  flex: 1;
  max-width: 320px;
}
.search-input:focus { border-color: var(--primary); }
.filter-select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  outline: none;
  cursor: pointer;
}
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all var(--transition);
}
.task-card:hover { border-color: var(--primary); transform: translateX(4px); box-shadow: var(--shadow); }
.task-checkbox {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}
.task-checkbox:hover { border-color: var(--success); }
.task-checkbox.done { background: var(--success); border-color: var(--success); }
.task-checkbox.done::after { content: '✓'; color: white; font-size: 12px; font-weight: 700; }
.task-info { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: 600; }
.task-title.done { text-decoration: line-through; color: var(--text-dim); }
.task-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
.task-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.priority-badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px;
}
.priority-urgent { background: #fef2f2; color: #dc2626; }
.priority-high { background: #fff7ed; color: #ea580c; }
.priority-medium { background: #f0f9ff; color: #0284c7; }
.priority-low { background: #f0fdf4; color: #16a34a; }
[data-theme="dark"] .priority-urgent { background: rgba(239,68,68,0.15); }
[data-theme="dark"] .priority-high { background: rgba(249,115,22,0.15); }
[data-theme="dark"] .priority-medium { background: rgba(6,182,212,0.15); color: #22d3ee; }
[data-theme="dark"] .priority-low { background: rgba(16,185,129,0.15); color: #34d399; }
.category-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.due-badge {
  font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600;
}
.due-overdue { background: rgba(239,68,68,0.12); color: var(--danger); }
.due-today { background: rgba(245,158,11,0.12); color: var(--warning); }
.due-upcoming { background: rgba(99,102,241,0.12); color: var(--primary); }
.progress-bar-mini {
  width: 60px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.progress-bar-mini .fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width var(--transition); }

/* ═══════ CHARTS ═══════ */
.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}
.chart-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.chart-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.chart-wrap { position: relative; max-height: 300px; display: flex; justify-content: center; }

/* ═══════ MODAL ═══════ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity var(--transition);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px;
  width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(8px);
  transition: transform var(--transition);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.3px; }
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;
}
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 9px 12px;
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-xs);
  font-size: 14px; outline: none; transition: border var(--transition);
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); }
.form-textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ═══════ CALENDAR ═══════ */
.calendar-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.calendar-header h3 { font-size: 18px; font-weight: 700; }
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.calendar-day-header {
  text-align: center; font-size: 11px; font-weight: 700;
  color: var(--text-dim); padding: 6px 0; text-transform: uppercase;
}
.calendar-day {
  aspect-ratio: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 6px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex; flex-direction: column;
  min-height: 75px;
  overflow: hidden;
}
.calendar-day:hover { border-color: var(--primary); }
.calendar-day.other-month { opacity: 0.3; }
.calendar-day.today { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.calendar-day-num { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.calendar-day-dots { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 4px; }
.calendar-dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}

/* ═══════ SUBJECTS & UNITS ═══════ */
.subjects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.subject-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.subject-card .subject-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.subject-card .subject-name { font-size: 16px; font-weight: 700; }
.subject-card .unit-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.subject-card .unit-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; background: var(--bg-input); border-radius: var(--radius-xs);
  font-size: 13px;
}
.subject-card .add-unit-form {
  display: flex; gap: 6px; margin-top: 8px;
}
.subject-card .add-unit-form input {
  flex: 1; padding: 6px 10px;
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-xs); font-size: 12px;
}

/* ═══════ JOB KANBAN ═══════ */
.kanban-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.kanban-column {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  min-width: 200px;
}
.kanban-column h3 {
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 12px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.kanban-column h3 .count { font-size: 11px; color: var(--text-muted); }
.kanban-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.job-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 12px;
  cursor: pointer;
  transition: all var(--transition);
}
.job-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow); }
.job-card .job-company { font-size: 13px; font-weight: 700; }
.job-card .job-role { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.job-card .job-meta { font-size: 10px; color: var(--text-dim); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
.job-card .job-priority { padding: 1px 6px; border-radius: 10px; font-size: 9px; font-weight: 600; }

/* ═══════ FINANCE ═══════ */
.budget-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.budget-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
}
.budget-item .budget-icon { font-size: 22px; flex-shrink: 0; }
.budget-item .budget-info { flex: 1; min-width: 0; }
.budget-item .budget-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.budget-item .budget-amounts { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.progress-bar {
  width: 100%; height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-top: 6px;
}
.progress-bar .fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
.progress-bar .fill.safe { background: var(--success); }
.progress-bar .fill.warn { background: var(--warning); }
.progress-bar .fill.danger { background: var(--danger); }

.transaction-list { display: flex; flex-direction: column; gap: 6px; }
.transaction-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-xs);
  transition: background var(--transition);
}
.transaction-item:hover { background: var(--bg-card-hover); }
.transaction-item .tx-icon { font-size: 18px; }
.transaction-item .tx-info { flex: 1; }
.transaction-item .tx-desc { font-size: 13px; font-weight: 500; }
.transaction-item .tx-meta { font-size: 11px; color: var(--text-muted); }
.transaction-item .tx-amount { font-weight: 700; font-size: 14px; white-space: nowrap; }

/* ═══════ EMPTY STATE ═══════ */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 13px; max-width: 400px; margin: 0 auto; }

/* ═══════ TABS (legacy page tabs) ═══════ */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.tab {
  padding: 8px 16px; border-radius: var(--radius-xs); font-size: 13px;
  font-weight: 600; cursor: pointer; border: none; background: none;
  color: var(--text-muted); transition: all var(--transition);
}
.tab:hover { background: var(--bg-card); color: var(--text); }
.tab.active { background: var(--primary); color: white; }

/* ═══════ CONFETTI ═══════ */
@keyframes confetti-fall {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
.confetti-piece {
  position: fixed; top: -10px; width: 8px; height: 8px;
  border-radius: 2px; z-index: 200; pointer-events: none;
  animation: confetti-fall 3s ease-out forwards;
}

/* ═══════ PULSE ═══════ */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.loading { animation: pulse 1.5s ease-in-out infinite; }

/* ═══════ TOAST ═══════ */
.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 300;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-xs); padding: 12px 20px;
  box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 500;
  transform: translateY(100px); opacity: 0;
  transition: all 0.3s ease;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-color: var(--danger); color: var(--danger); }
.toast.success { border-color: var(--success); color: var(--success); }

/* ═══════ RESPONSIVE ═══════ */
@media (max-width: 1024px) {
  :root { --sidebar-width: 200px; }
  .header { padding: 14px 20px; }
  .content { padding: 20px; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}

@media (max-width: 900px) {
  :root { --sidebar-width: 64px; }
  .sidebar { padding: 16px 6px; gap: 4px; }
  .sidebar .logo span { display: none; }
  .sidebar .logo { font-size: 20px; padding: 0 4px 10px; justify-content: center; }
  .nav-item { justify-content: center; padding: 10px 4px; }
  .nav-item .icon + span { display: none; }
  .nav-section { display: none; }
  .theme-toggle { justify-content: center; }
  .theme-toggle .icon + span { display: none; }

  .header { padding: 12px 16px; }
  .header h1 { font-size: 18px; }
  .content { padding: 16px; }
  .tab-nav { padding: 0 8px; }
  .tab-link { padding: 8px 12px; font-size: 12px; }

  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .charts-grid { grid-template-columns: 1fr; }
  .kanban-board { display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
  .kanban-column { min-width:auto; }
  .subjects-grid { grid-template-columns: 1fr; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  .task-right { flex-direction:column; gap:4px; align-items:flex-end; }

  .modal { width: 95%; padding: 20px; max-width: none; }
  .modal h2 { font-size: 17px; }
  .budget-item { flex-wrap: wrap; }
}

@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat-card { padding: 12px; }
  .stat-card .stat-value { font-size: 20px; }
  .tab-link { padding: 8px 10px; font-size: 12px; }
  .header-actions { flex-wrap:wrap; gap:4px; }
  .header-actions .btn { font-size:11px; padding:6px 10px; }
  .toolbar { flex-direction:column; }
  .search-input { max-width:none; }
}

/* ═══════ INTERMEDIATE FIXES ═══════ */
@media (min-width: 901px) and (max-width: 1100px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .charts-grid { grid-template-columns: repeat(2, 1fr); }
  .kanban-board { overflow-x:auto; padding-bottom:8px; }
  .kanban-column { min-width:200px; flex-shrink:0; }
}

/* ═══════ LARGER KANBAN SCROLL ═══════ */
@media (min-width: 1101px) {
  .kanban-board { overflow-x:auto; padding-bottom:8px; }
  .kanban-column { min-width:220px; flex-shrink:0; }
}
/* ═══════ ANIMATIONS ═══════ */
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
@keyframes slideIn { from { opacity:0; transform: translateX(-12px); } to { opacity:1; transform: translateX(0); } }
.content > * { animation: fadeIn 0.25s ease-out; }
.task-card { animation: slideIn 0.2s ease-out; }
.task-card:nth-child(1) { animation-delay: 0.02s; }
.task-card:nth-child(2) { animation-delay: 0.04s; }
.task-card:nth-child(3) { animation-delay: 0.06s; }
.task-card:nth-child(4) { animation-delay: 0.08s; }
.task-card:nth-child(5) { animation-delay: 0.10s; }

/* ═══════ SMOOTH INTERACTIONS ═══════ */
.btn { transition: all 0.18s cubic-bezier(0.4,0,0.2,1); }
.btn:active { transform: scale(0.96) !important; }
.task-card { transition: all 0.2s cubic-bezier(0.4,0,0.2,1); }
.task-card:hover { transform: translateX(4px); box-shadow: var(--shadow); }
.task-card:active { transform: scale(0.99); }
.nav-item { transition: all 0.18s cubic-bezier(0.4,0,0.2,1); position:relative; overflow:hidden; }
.nav-item::after {
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.08) 0%, transparent 60%);
  opacity:0; transition: opacity 0.3s;
}
.nav-item:hover::after { opacity:1; }
.stat-card { transition: all 0.25s cubic-bezier(0.4,0,0.2,1); }
.stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.25); }
.kanban-column { transition: all 0.2s ease; }
.job-card { transition: all 0.18s cubic-bezier(0.4,0,0.2,1); }
.job-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 3px var(--primary-glow); }
.modal-overlay { backdrop-filter: blur(4px); }
.modal { animation: fadeIn 0.2s ease-out; }

/* ═══════ SETTINGS ═══════ */
.settings-container { max-width:680px; display:flex; flex-direction:column; gap:20px; }
.settings-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px;
  transition: border-color var(--transition);
}
.settings-card:hover { border-color:var(--primary); }
.setting-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.setting-row:last-child { border-bottom:none; }

/* ═══════ SMOOTH SCROLL ═══════ */
.content { scroll-behavior: smooth; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ═══════ BETTER FOCUS ═══════ */
*:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }
button:focus-visible, .btn:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

/* ═══════ TOAST ═══════ */
.toast {
  position:fixed; bottom:24px; right:24px; z-index:300;
  padding:12px 20px; border-radius:var(--radius-xs);
  font-size:13px; font-weight:600; color:white;
  animation: fadeIn 0.2s ease-out;
  box-shadow: var(--shadow-lg); pointer-events:none;
}
.toast.success { background:var(--success); }
.toast.error { background:var(--danger); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="logo"><span>🌿</span> <span>LifePlanner</span></div>
  <button class="theme-toggle" id="themeToggle"><span class="icon">🌙</span> <span id="themeLabel">Dark Mode</span></button>
</aside>

<!-- MAIN CONTENT -->
<main class="main">
  <div class="tab-nav" id="tabNav">
    <button class="tab-link active" data-tab="academic">📚 Academic</button>
    <button class="tab-link" data-tab="jobs">💼 Job Tracker</button>
    <button class="tab-link" data-tab="finance">💰 Finance</button>
  </div>
  <header class="header">
    <h1 id="pageTitle">Academic Dashboard</h1>
    <div class="header-actions" id="headerActions"></div>
  </header>
  <div class="content" id="contentArea"></div>
</main>

<!-- TASK MODAL -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2 id="modalTitle">New Task</h2>
    <div class="form-group"><label>Title</label><input class="form-input" id="formTitle" placeholder="e.g. Calculus Problem Set 7"></div>
    <div class="form-group"><label>Description</label><textarea class="form-textarea" id="formDesc" placeholder="Details, notes, or requirements..."></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Due Date</label><input class="form-input" type="date" id="formDue"></div>
      <div class="form-group"><label>Priority</label>
        <select class="form-select" id="formPriority">
          <option value="medium">Medium</option><option value="low">Low</option>
          <option value="high">High</option><option value="urgent">Urgent</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Category</label><select class="form-select" id="formCategory"></select></div>
      <div class="form-group"><label>Subject</label><select class="form-select" id="formSubject"><option value="">None</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Unit</label><select class="form-select" id="formUnit"><option value="">None</option></select></div>
      <div class="form-group"><label>Target Grade</label><select class="form-select" id="formTargetGrade">
        <option value="">None</option>
        <option value="A+">A+</option><option value="A">A</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B">B</option><option value="B-">B-</option>
        <option value="C+">C+</option><option value="C">C</option><option value="C-">C-</option>
        <option value="D">D</option><option value="F">F</option>
      </select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Est. Hours</label><input class="form-input" type="number" id="formHours" placeholder="e.g. 4" min="0.5" step="0.5"></div>
      <div class="form-group"><label>Status</label>
        <select class="form-select" id="formStatus">
          <option value="not_started">Not Started</option><option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Progress (%)</label><input class="form-input" type="number" id="formProgress" value="0" min="0" max="100"></div>
    <div class="form-group"><label>Notes</label><textarea class="form-textarea" id="formNotes" placeholder="Additional notes..."></textarea></div>
    <div class="form-actions">
      <button class="btn btn-danger btn-sm" id="formDelete" style="display:none; margin-right:auto;">Delete</button>
      <button class="btn btn-secondary" id="formCancel">Cancel</button>
      <button class="btn btn-secondary" id="formAutoPlan">🧠 Auto-Plan</button>
      <button class="btn btn-primary" id="formSave">Save Task</button>
    </div>
  </div>
</div>

<!-- JOB MODAL -->
<div class="modal-overlay" id="jobModal">
  <div class="modal">
    <h2 id="jobModalTitle">New Job Application</h2>
    <div class="form-row">
      <div class="form-group"><label>Company</label><input class="form-input" id="jobFormCompany" placeholder="e.g. Google"></div>
      <div class="form-group"><label>Role</label><input class="form-input" id="jobFormRole" placeholder="e.g. Software Engineer"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Status</label>
        <select class="form-select" id="jobFormStatus">
          <option value="applied">Applied</option><option value="phone_screen">Phone Screen</option>
          <option value="interviewing">Interviewing</option><option value="offer">Offer</option>
          <option value="accepted">Accepted</option><option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="form-group"><label>Priority</label>
        <select class="form-select" id="jobFormPriority">
          <option value="medium">Medium</option><option value="low">Low</option><option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Applied Date</label><input class="form-input" type="date" id="jobFormAppliedDate"></div>
      <div class="form-group"><label>Follow-Up Date</label><input class="form-input" type="date" id="jobFormFollowUpDate"></div>
    </div>
    <div class="form-group"><label>URL</label><input class="form-input" id="jobFormUrl" placeholder="https://..."></div>
    <div class="form-group"><label>Salary Range</label><input class="form-input" id="jobFormSalary" placeholder="e.g. $80k-$120k"></div>
    <div class="form-row">
      <div class="form-group"><label>Contact Name</label><input class="form-input" id="jobFormContactName" placeholder="e.g. Jane Smith"></div>
      <div class="form-group"><label>Contact Email</label><input class="form-input" id="jobFormContactEmail" placeholder="e.g. jane@company.com"></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea class="form-textarea" id="jobFormNotes" placeholder="Interview notes, links, reminders..."></textarea></div>
    <div class="form-actions">
      <button class="btn btn-danger btn-sm" id="jobFormDelete" style="display:none; margin-right:auto;">Delete</button>
      <button class="btn btn-secondary" onclick="closeJobModal()">Cancel</button>
      <button class="btn btn-primary" id="jobFormSave">Save</button>

</div>

<!-- FINANCE MODAL (transactions) -->
<div class="modal-overlay" id="txModal">
  <div class="modal">
    <h2 id="txModalTitle">Add Transaction</h2>
    <div class="form-row">
      <div class="form-group"><label>Type</label>
        <select class="form-select" id="txFormType">
          <option value="expense">Expense</option><option value="income">Income</option>
        </select>
      </div>
      <div class="form-group"><label>Amount</label><input class="form-input" type="number" id="txFormAmount" placeholder="0.00" step="0.01" min="0.01"></div>

      <div class="form-group"><label>Category</label><select class="form-select" id="txFormCategory"></select></div>
      <div class="form-group"><label>Date</label><input class="form-input" type="date" id="txFormDate"></div>

      <button class="btn btn-primary" id="txFormSave">Save</button>

</div>

<!-- BUDGET MODAL -->
<div class="modal-overlay" id="budgetModal">
  <div class="modal">
    <h2 id="budgetModalTitle">Add Budget</h2>
    <div class="form-row">
      <div class="form-group"><label>Category Name</label><input class="form-input" id="budgetFormCategory" placeholder="e.g. Food & Dining"></div>
      <div class="form-group"><label>Monthly Limit</label><input class="form-input" type="number" id="budgetFormLimit" placeholder="0.00" step="0.01" min="0.01"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Icon</label><input class="form-input" id="budgetFormIcon" placeholder="💰" maxlength="2"></div>
      <div class="form-group"><label>Color</label><input class="form-input" type="color" id="budgetFormColor" value="#6366f1"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-danger btn-sm" id="budgetFormDelete" style="display:none; margin-right:auto;">Delete</button>
      <button class="btn btn-secondary" onclick="closeBudgetModal()">Cancel</button>
      <button class="btn btn-primary" id="budgetFormSave">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   LIFEPLANNER v2 — Full Frontend App
   ═══════════════════════════════════════════════════════ */
const API = '';
let tasks = [], categories = [], subjects = [], jobs = [], budgets = [], transactions = [];
let currentTab = 'academic';
let currentAcademicPage = 'dashboard';
let currentJobsFilter = 'all';
let financePage = 'overview';
let editingTaskId = null;
let editingJobId = null;
let editingBudgetId = null;
let chartInstances = {};

// ── Toast ────────────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type + ' show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── API Helpers ──────────────────────────────────────────────────────
async function api(url, opts = {}) {
  const res = await fetch(API + url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    let detail = 'Request failed';
    try { const e = await res.json(); detail = e.detail || detail; } catch(_) {}
    throw new Error(detail);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : {};
}

// ── Load All Data ────────────────────────────────────────────────────
async function loadAllData() {
  try {
    [tasks, categories, subjects] = await Promise.all([
      api('/api/tasks'), api('/api/categories'), api('/api/subjects')
    ]);
  } catch(e) { console.error('Load error:', e); }
}
async function loadJobData() {
  try { jobs = await api('/api/jobs'); } catch(e) { console.error(e); }
}
async function loadFinanceData() {
  try {
    const month = new Date().toISOString().slice(0,7);
    [budgets, transactions] = await Promise.all([
      api('/api/budgets'), api('/api/transactions?month=' + month)
    ]);
  } catch(e) { console.error(e); }
}

// ── Tab Navigation ───────────────────────────────────────────────────
document.querySelectorAll('.tab-link').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-link').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    switchTab();
  });
});

async function switchTab() {
  destroyAllCharts();
  switch(currentTab) {
    case 'academic':
      document.getElementById('pageTitle').textContent = currentAcademicPage === 'dashboard' ? 'Academic Dashboard' : 'Tasks';
      document.getElementById('headerActions').innerHTML = '<button class="btn btn-primary" id="addTaskBtn">+ New Task</button><button class="btn btn-secondary" id="addSubjectBtn" style="margin-left:6px;">+ Subject</button>';
      document.getElementById('addTaskBtn').addEventListener('click', () => openTaskModal());
      document.getElementById('addSubjectBtn').addEventListener('click', () => openSubjectModal());
      await loadAllData();
      renderAcademic();
      break;
    case 'jobs':
      document.getElementById('pageTitle').textContent = 'Job Tracker';
      document.getElementById('headerActions').innerHTML = '<button class="btn btn-primary" id="addJobBtn">+ Add Job</button>';
      document.getElementById('addJobBtn').addEventListener('click', () => openJobModal());
      await loadJobData();
      renderJobs();
      break;
    case 'finance':
      document.getElementById('pageTitle').textContent = 'Finance Manager';
      document.getElementById('headerActions').innerHTML = '<button class="btn btn-primary" id="addTxBtn">+ Transaction</button><button class="btn btn-secondary" id="addBudgetBtn" style="margin-left:6px;">+ Budget</button>';
      document.getElementById('addTxBtn').addEventListener('click', () => openTxModal());
      document.getElementById('addBudgetBtn').addEventListener('click', () => openBudgetModal());
      await loadFinanceData();
      renderFinance();
      break;
  }
}

// ═══════════════════════════════════════════════════════
// ACADEMIC SECTION
// ═══════════════════════════════════════════════════════

function renderAcademic() {
  buildAcademicSidebar();
  switch(currentAcademicPage) {
    case 'dashboard': renderAcademicDashboard(); break;
    case 'subjects': renderSubjectsPage(); break;
    case 'tasks': renderAcademicTasks(); break;
    case 'calendar': renderCalendar(); break;
    case 'settings': renderSettingsPage(); break;
  }
}

// ── Academic Dashboard ───────────────────────────────────────────────
async function renderAcademicDashboard() {
  document.getElementById('pageTitle').textContent = 'Academic Dashboard';
  let stats;
  try { stats = await api('/api/stats'); } catch(e) { stats = {}; }
  const c = document.getElementById('contentArea');

  let alert = '';
  if (stats.overdue > 0) alert = `<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius);padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;"><span>⚠️</span> You have <strong>${stats.overdue}</strong> overdue task(s)!</div>`;

  // Build sidebar nav for academic — handled by renderAcademic()
  c.innerHTML = alert + `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-value">${stats.total||0}</div><div class="stat-label">Total Tasks</div></div>
      <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" style="color:var(--success)">${stats.completed||0}</div><div class="stat-label">Completed</div></div>
      <div class="stat-card"><div class="stat-icon">🔄</div><div class="stat-value" style="color:var(--info)">${stats.in_progress||0}</div><div class="stat-label">In Progress</div></div>
      <div class="stat-card"><div class="stat-icon">🚨</div><div class="stat-value" style="color:var(--danger)">${stats.overdue||0}</div><div class="stat-label">Overdue</div></div>
      <div class="stat-card"><div class="stat-icon">📈</div><div class="stat-value" style="color:var(--primary)">${stats.completion_rate||0}%</div><div class="stat-label">Completion Rate</div></div>
      <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-value" style="color:var(--warning)">${stats.due_this_week||0}</div><div class="stat-label">Due This Week</div></div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>📊 Tasks by Category</h3>
        <div class="chart-wrap"><canvas id="chartCategoryPie"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>🔥 Tasks by Priority</h3>
        <div class="chart-wrap"><canvas id="chartPriorityBar"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>📖 Subject Distribution</h3>
        <div class="chart-wrap"><canvas id="chartSubjectDoughnut"></canvas></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:14px;">📌 Upcoming Deadlines</h3>
        ${renderUpcomingList()}
      </div>
      <div>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:14px;">📊 Category Breakdown</h3>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${(stats.category_breakdown||[]).filter(x=>x.count>0).map(cat=>`
            <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-card);border-radius:var(--radius-xs);">
              <div style="width:10px;height:10px;border-radius:50%;background:${cat.color};flex-shrink:0;"></div>
              <span style="flex:1;font-size:13px;font-weight:500;">${esc(cat.name)}</span>
              <span style="font-weight:700;font-size:14px;color:var(--text);">${cat.count}</span>
            </div>
          `).join('') || '<div style="color:var(--text-muted);font-size:13px;">No tasks yet</div>'}
        </div>
      </div>
    </div>`;

  // Render charts after DOM update
  setTimeout(() => {
    renderCategoryPieChart(stats.category_breakdown || []);
    renderPriorityBarChart(stats.priority_breakdown || []);
    renderSubjectDoughnutChart(stats.subject_breakdown || []);
  }, 100);
}

function renderCategoryPieChart(data) {
  const ctx = document.getElementById('chartCategoryPie');
  if (!ctx) return;
  if (chartInstances.categoryPie) chartInstances.categoryPie.destroy();
  const filtered = data.filter(d => d.count > 0);
  if (!filtered.length) return;
  chartInstances.categoryPie = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: filtered.map(d => d.name),
      datasets: [{
        data: filtered.map(d => d.count),
        backgroundColor: filtered.map(d => d.color),
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim(),
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim(), font: { size: 11 }, padding: 12 }
        }
      }
    }
  });
}

function renderPriorityBarChart(data) {
  const ctx = document.getElementById('chartPriorityBar');
  if (!ctx) return;
  if (chartInstances.priorityBar) chartInstances.priorityBar.destroy();
  if (!data.length) return;
  const colors = { urgent: '#ef4444', high: '#f59e0b', medium: '#06b6d4', low: '#10b981' };
  const order = ['urgent','high','medium','low'];
  const sorted = order.map(p => ({ priority: p, count: (data.find(d => d.priority === p) || {}).count || 0 }));
  chartInstances.priorityBar = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(d => d.priority.charAt(0).toUpperCase() + d.priority.slice(1)),
      datasets: [{
        label: 'Tasks',
        data: sorted.map(d => d.count),
        backgroundColor: sorted.map(d => colors[d.priority]),
        borderRadius: 6,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {

function renderSubjectDoughnutChart(data) {
  const ctx = document.getElementById('chartSubjectDoughnut');
  if (!ctx) return;
  if (chartInstances.subjectDoughnut) chartInstances.subjectDoughnut.destroy();
  const filtered = data.filter(d => d.count > 0);
  if (!filtered.length) return;
  const colors = ['#6366f1','#f59e0b','#10b981','#ef4444','#06b6d4','#8b5cf6','#ec4899','#f97316','#14b8a6','#a855f7'];
  chartInstances.subjectDoughnut = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: filtered.map(d => d.name),
      datasets: [{
        data: filtered.map(d => d.count),
        backgroundColor: filtered.map((d,i) => d.color || colors[i % colors.length]),
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim(),
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim(), font: { size: 11 }, padding: 12 } } }
    }
  });
}

function renderAcademicTasks() {

  filtered.sort((a,b) => {
    const p = { urgent:0, high:1, medium:2, low:3 };

        <option value="medium">Medium</option><option value="low">Low</option>
      </select>

        <option value="">All Categories</option>
        ${categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
      </select>
      <select class="filter-select" id="filterSubject" onchange="filterAcademicTasks()">
        <option value="">All Subjects</option>

      </select>
    </div>
    <div class="task-list" id="taskListContainer">

    </div>`;
}

function filterAcademicTasks() {
  let filtered = [...tasks].filter(t => t.status !== 'completed');
  const si = document.getElementById('searchInput');
  const fp = document.getElementById('filterPriority');
  const fc = document.getElementById('filterCategory');
  const fs = document.getElementById('filterSubject');
  if (si && si.value) {
    const q = si.value.toLowerCase();
    filtered = filtered.filter(t => t.title.toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q));
  }
  if (fp && fp.value) filtered = filtered.filter(t => t.priority === fp.value);
  if (fc && fc.value) filtered = filtered.filter(t => t.category_id == fc.value);
  if (fs && fs.value) filtered = filtered.filter(t => t.subject_id == fs.value);
  filtered.sort((a,b) => {
    const p = { urgent:0, high:1, medium:2, low:3 };
    return (p[a.priority]||2) - (p[b.priority]||2) || (a.due_date||'9').localeCompare(b.due_date||'9');
  });
  const container = document.getElementById('taskListContainer');
  if (container) {
    container.innerHTML = filtered.length
      ? filtered.map(renderTaskCard).join('')
      : '<div class="empty-state"><div class="icon">📭</div><h3>No tasks match</h3><p>Try adjusting your filters.</p></div>';
  }
}

// ── Calendar ─────────────────────────────────────────────────────────
let calOffset = 0;

function renderCalendar() {
  document.getElementById('pageTitle').textContent = 'Calendar';
  calOffset = 0;
  const now = new Date();
  renderCalendarMonth(now.getFullYear(), now.getMonth());
}

function renderCalendarMonth(year, month) {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date().toISOString().slice(0,10);
  const taskMap = {};
  tasks.filter(t => t.due_date).forEach(t => {
    if (!taskMap[t.due_date]) taskMap[t.due_date] = [];
    taskMap[t.due_date].push(t);
  });
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = `<div class="calendar-header">
    <button class="btn btn-secondary btn-sm" onclick="shiftMonth(-1)">◀</button>
    <h3>${months[month]} ${year}</h3>
    <button class="btn btn-secondary btn-sm" onclick="shiftMonth(1)">▶</button>
  </div><div class="calendar-grid">`;
  days.forEach(d => html += `<div class="calendar-day-header">${d}</div>`);
  for (let i = 0; i < firstDay; i++) html += `<div class="calendar-day other-month"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks = taskMap[ds] || [];
    html += `<div class="calendar-day${ds===today?' today':''}">
      <div class="calendar-day-num">${d}</div>
      <div class="calendar-day-dots">${dayTasks.slice(0,5).map(t=>`<div class="calendar-dot" style="background:${t.category_color||'#6366f1'}" title="${esc(t.title)}"></div>`).join('')}</div>
      ${dayTasks.length>5?`<div style="font-size:9px;color:var(--text-muted);margin-top:2px;">+${dayTasks.length-5}</div>`:''}
    </div>`;
  }
  html += `</div>`;
  document.getElementById('contentArea').innerHTML = html;
}

window.shiftMonth = function(delta) {
  calOffset += delta;
  const now = new Date();
  now.setMonth(now.getMonth() + calOffset);
  renderCalendarMonth(now.getFullYear(), now.getMonth());
};

async function openTaskModal(id = null) {

    const t = tasks.find(x => x.id === id);
    if (!t) return;
    document.getElementById('modalTitle').textContent = 'Edit Task';
    document.getElementById('formTitle').value = t.title;
    document.getElementById('formDesc').value = t.description || '';
    document.getElementById('formDue').value = t.due_date || '';
    document.getElementById('formPriority').value = t.priority;
    document.getElementById('formCategory').value = t.category_id || '';
    document.getElementById('formSubject').value = t.subject_id || '';
    document.getElementById('formTargetGrade').value = t.target_grade || '';
    document.getElementById('formHours').value = t.estimated_hours || '';
    document.getElementById('formStatus').value = t.status;
    document.getElementById('formProgress').value = t.progress;
    document.getElementById('formNotes').value = t.notes || '';

async function saveTask() {
  const data = {
    title: document.getElementById('formTitle').value.trim(),
    description: document.getElementById('formDesc').value.trim(),
    due_date: document.getElementById('formDue').value || null,
    priority: document.getElementById('formPriority').value,
    category_id: parseInt(document.getElementById('formCategory').value) || null,
    subject_id: parseInt(document.getElementById('formSubject').value) || null,
    unit_id: parseInt(document.getElementById('formUnit').value) || null,
    target_grade: document.getElementById('formTargetGrade').value,
    estimated_hours: parseFloat(document.getElementById('formHours').value) || null,
    status: document.getElementById('formStatus').value,
    progress: parseInt(document.getElementById('formProgress').value) || 0,
    notes: document.getElementById('formNotes').value.trim(),
  };
  if (!data.title) return showToast('Title is required!', 'error');
  try {
    if (editingTaskId) {
      await api(`/api/tasks/${editingTaskId}`, { method: 'PUT', body: JSON.stringify(data) });
    } else {
      await api('/api/tasks', { method: 'POST', body: JSON.stringify(data) });

    await loadAllData();
    renderAcademic();
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

    let msg = result.message + '\n\n' + result.plan.map(p => `${p.date}: ${p.milestone} (${p.hours}h)`).join('\n');
    alert(msg);
    closeTaskModal();
    await loadAllData();
    renderAcademic();
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

async function toggleComplete(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const newStatus = t.status === 'completed' ? 'not_started' : 'completed';
  try {
    await api(`/api/tasks/${id}`, { method: 'PUT', body: JSON.stringify({ status: newStatus, progress: newStatus === 'completed' ? 100 : 0 }) });
    if (newStatus === 'completed') celebrate();
    await loadAllData();
    renderAcademic();
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

function renderBudgetProgressList() {
  if (!budgets.length) return '<div style="color:var(--text-muted);font-size:13px;">No budgets set</div>';
  return budgets.map(b => {
    const spent = b.spent || 0;
    const limit = b.monthly_limit || 1;
    const pct = Math.min(100, (spent / limit) * 100);
    let cls = pct > 90 ? 'danger' : pct > 75 ? 'warn' : 'safe';
    return `
      <div class="budget-item">
        <div class="budget-icon">${b.icon||'💰'}</div>
        <div class="budget-info">
          <div class="budget-name"><span>${esc(b.category)}</span><span style="font-size:11px;color:var(--text-muted);">$${spent.toFixed(0)} / $${limit.toFixed(0)}</span></div>
          <div class="progress-bar"><div class="fill ${cls}" style="width:${pct}%;background:${pct>90?'var(--danger)':pct>75?'var(--warning)':b.color||'var(--success)'}"></div></div>
          <div class="budget-amounts">Remaining: <strong style="color:${(limit-spent)>=0?'var(--success)':'var(--danger)'}">$${(limit-spent).toFixed(2)}</strong></div>
        </div>
      </div>`;
  }).join('');
}

function renderFinancePieChart(data) {
  const ctx = document.getElementById('chartFinancePie');
  if (!ctx) return;
  if (chartInstances.financePie) chartInstances.financePie.destroy();
  if (!data.length) return;
  const colors = ['#ef4444','#f59e0b','#06b6d4','#10b981','#8b5cf6','#ec4899','#6366f1','#f97316','#14b8a6','#a855f7'];
  chartInstances.financePie = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: data.map(d => d.category),
      datasets: [{
        data: data.map(d => d.total),
        backgroundColor: data.map((d,i) => colors[i % colors.length]),
        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim(),
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim(), font: { size: 11 }, padding: 12 } } }
    }
  });
}

function renderTransactionItems(filterType, filterCat) {
  let filtered = [...transactions];
  const typeEl = document.getElementById('txFilterType');
  const catEl = document.getElementById('txFilterCategory');
  const type = filterType || (typeEl ? typeEl.value : '');
  const cat = filterCat || (catEl ? catEl.value : '');
  if (type) filtered = filtered.filter(t => t.type === type);
  if (cat) filtered = filtered.filter(t => t.category === cat);
  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if (!filtered.length) return '<div class="empty-state"><div class="icon">💳</div><h3>No transactions</h3><p>Add your first transaction to start tracking.</p></div>';
  return filtered.map(t => `
    <div class="transaction-item">
      <div class="tx-icon">${t.type==='income' ? '💵' : '💸'}</div>
      <div class="tx-info">
        <div class="tx-desc">${esc(t.description || t.category)}</div>
        <div class="tx-meta">${t.category} · ${fmtDate(t.date)}</div>
      </div>
      <div class="tx-amount" style="color:${t.type==='income'?'var(--success)':'var(--danger)'}">${t.type==='income'?'+':'-'}$${t.amount.toFixed(2)}</div>
      <button class="btn btn-danger btn-xs" onclick="deleteTransaction(${t.id})" title="Delete">✕</button>
    </div>`).join('');
}

function filterTransactions() {
  const container = document.getElementById('txListContainer');

// CONFETTI
// ═══════════════════════════════════════════════════════

function celebrate() {
  const colors = ['#6366f1','#f59e0b','#10b981','#ef4444','#06b6d4','#8b5cf6','#ec4899'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    piece.style.width = (5 + Math.random() * 8) + 'px';
    piece.style.height = (5 + Math.random() * 8) + 'px';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3500);
  }
}

// ═══════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('planner-theme', isDark ? 'light' : 'dark');
  // Update all theme toggle buttons
  document.querySelectorAll('#themeToggle').forEach(tt => {
    const icon = tt.querySelector('.icon');
    const label = tt.querySelector('#themeLabel');
    if (icon) icon.textContent = isDark ? '☀️' : '🌙';
    if (label) label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
  });
  // Redraw charts with new theme colors
  setTimeout(() => {
    destroyAllCharts();
    if (currentTab === 'academic' && currentAcademicPage === 'dashboard') renderAcademicDashboard();
    if (currentTab === 'finance' && financePage === 'overview') renderFinanceOverview();
  }, 200);
}

function destroyAllCharts() {
  Object.values(chartInstances).forEach(chart => { try { chart.destroy(); } catch(e) {} });
  chartInstances = {};
}

const savedTheme = localStorage.getItem('planner-theme');
if (savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeTaskModal();
    closeJobModal();
    closeTxModal();
    closeBudgetModal();
  }
  if (e.key === 'n' && e.ctrlKey) { e.preventDefault(); openTaskModal(); }
});

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function getDueClass(due) {
  if (!due) return '';
  const today = new Date().toISOString().slice(0,10);
  if (due < today) return 'due-overdue';
  if (due === today) return 'due-today';
  return 'due-upcoming';
}
