<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trackademic</title>
<meta name="theme-color" content="#D2461A">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/icon-32.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<!-- Applies the saved colours, fonts and light/dark before first paint (no flash) -->
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/intro.css">
</head>
<body>
<!-- Continues the desktop start-up animation, then fades into the app (only when launched from the splash) -->
<div class="intro static" id="intro" hidden>
  <!-- intro:start -->
  <div class="intro-aurora" aria-hidden="true"><i class="intro-blob a"></i><i class="intro-blob b"></i><i class="intro-blob c"></i></div>
  <div class="intro-grain" aria-hidden="true"></div>
  <div class="intro-group">
    <div class="intro-logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="intro-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--grad-a)"/><stop offset="1" style="stop-color:var(--grad-b)"/></linearGradient></defs>
        <rect class="intro-tile" x="1.5" y="1.5" width="29" height="29" rx="9" fill="url(#intro-g)"/>
        <path class="intro-check" pathLength="1" d="M8.5 16.5l4.5 4.5 10-10.5" fill="none" style="stroke:var(--accent-ink)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="intro-arrow" pathLength="1" d="M18.5 10.5h5v5" fill="none" style="stroke:var(--accent-ink)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="intro-ring" aria-hidden="true"></span>
      <span class="intro-sparks" aria-hidden="true"><i style="--dx:-6px;--dy:-33px"></i><i style="--dx:3px;--dy:-48px"></i><i style="--dx:18px;--dy:-59px"></i><i style="--dx:17px;--dy:-29px"></i><i style="--dx:34px;--dy:-34px"></i><i style="--dx:53px;--dy:-33px"></i><i style="--dx:32px;--dy:-11px"></i><i style="--dx:48px;--dy:-4px"></i><i style="--dx:61px;--dy:10px"></i><i style="--dx:31px;--dy:13px"></i><i style="--dx:39px;--dy:28px"></i><i style="--dx:40px;--dy:47px"></i></span>
    </div>
    <div class="intro-word" role="img" aria-label="Trackademic"><span style="--i:0">T</span><span style="--i:1">r</span><span style="--i:2">a</span><span style="--i:3">c</span><span style="--i:4">k</span><span class="g" style="--i:5;background-size:3.6em 100%;background-position:0.00em 0">a</span><span class="g" style="--i:6;background-size:3.6em 100%;background-position:-0.60em 0">d</span><span class="g" style="--i:7;background-size:3.6em 100%;background-position:-1.20em 0">e</span><span class="g" style="--i:8;background-size:3.6em 100%;background-position:-1.80em 0">m</span><span class="g" style="--i:9;background-size:3.6em 100%;background-position:-2.40em 0">i</span><span class="g" style="--i:10;background-size:3.6em 100%;background-position:-3.00em 0">c</span></div>
    <div class="intro-tag">Plan &middot; Track &middot; Achieve</div>
    <div class="intro-bar" aria-hidden="true"></div>
  </div>
  <div class="intro-version"></div>
  <!-- intro:end -->
</div>
<script>
  (function () {
    const q = new URLSearchParams(location.search);
    if (q.get('from') !== 'splash') return;
    const el = document.getElementById('intro');
    el.hidden = false;
    // Keep the drifting background in step with the splash so the hand-off is seamless
    el.style.setProperty('--t-offset', -(Number(q.get('t')) || 0) / 1000 + 's');
  })();
</script>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Main">
    <a class="brand" href="#/today" aria-label="Trackademic home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Track<b>ademic</b></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="navFoot"></div>
  </aside>

  <div class="main">
    <div class="update-banner" id="updateBanner" hidden></div>
    <header class="topbar">
      <div class="topbar-titles">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <div class="topbar-actions" id="headerActions"></div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <header class="drawer-head">
    <h2 id="drawerTitle"></h2>
    <button class="icon-btn" data-action="close-drawer" aria-label="Close"></button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer class="drawer-foot" id="drawerFoot"></footer>
</section>

<div class="dialog-wrap" id="confirm" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="confirmNo">Cancel</button>
      <button class="btn btn-danger" id="confirmYes">Delete</button>
    </div>
  </div>
</div>

<div class="update-overlay" id="updateOverlay" hidden>
  <div class="dialog" role="alertdialog" aria-live="assertive">
    <div class="spinner" aria-hidden="true"></div>
    <h3>Installing update</h3>
    <p>Trackademic will close, update and open again by itself. Your data is safe.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/icons.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
