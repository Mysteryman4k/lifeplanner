[project]
name = "trackademic"
dynamic = ["version"]
description = "Student planner, job tracker and money manager"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ui: browser smoke tests (need Playwright and Chromium)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["build", "dist", "venv", "*.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E701", "E702", "B008", "UP007", "UP045"]
